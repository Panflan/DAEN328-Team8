services:

  db:
    image: postgres:16
    restart: unless-stopped
    container_name: postgres-main

    environment:
      POSTGRES_DB: ${PSQL_DB}
      POSTGRES_USER: ${PSQL_USER}
      POSTGRES_PASSWORD: ${PSQL_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PSQL_USER} -d ${PSQL_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  cdc_db:
    image: postgres:16
    restart: unless-stopped
    container_name: postgres-cdc

    environment:
      POSTGRES_DB: ${CDC_DB}
      POSTGRES_USER: ${CDC_USER}
      POSTGRES_PASSWORD: ${CDC_PASSWORD}

    volumes:
      - cdc_data:/var/lib/postgresql/data

    healthcheck:
      test: 
        [
          "CMD-SHELL", 
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  etl:
    build: .
    container_name: etl

    env_file:
      - .env

    volumes:
      - ./data:/app/data

    depends_on:
      cdc_db:
        condition: service_healthy

    command: python -u etl.py

  # ADD STREAMLIT CONTAINER HERE #
  # ---------------------------- #
  # ---------------------------- #
  # ---------------------------- #
  # ---------------------------- #

volumes:
  postgres_data:
  cdc_data: