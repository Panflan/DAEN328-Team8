services:

  db:
    image: postgres:16
    restart: unless-stopped
    container_name: postgres-main

    environment:
      POSTGRES_DB: ${PSQL_DB}
      POSTGRES_USER: ${PSQL_USER}
      POSTGRES_PASSWORD: ${PSQL_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test: 
        [
          "CMD-SHELL", 
          "pg_isready -U ${PSQL_USER} -d ${PSQL_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  cdc_db:
    image: postgres:16
    restart: unless-stopped
    container_name: postgres-cdc

    environment:
      POSTGRES_DB: ${CDC_DB}
      POSTGRES_USER: ${CDC_USER}
      POSTGRES_PASSWORD: ${CDC_PASSWORD}

    volumes:
      - cdc_data:/var/lib/postgresql/data

    healthcheck:
      test: 
        [
          "CMD-SHELL", 
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  etl:
    build: .
    container_name: etl

    env_file:
      - .env

    volumes:
      - ./data:/app/data

    depends_on:
      cdc_db:
        condition: service_healthy

      db:
        condition: service_healthy

    command: python -u etl.py

  streamlit:
    build: .

    command: streamlit run streamlit_app.py --server.address=0.0.0.0

    env_file:
      - .env

    ports:
      - "8501:8501"
      
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  cdc_data: